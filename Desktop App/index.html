<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Locked Computer</title>
  <style>
    body {
      margin: 0;
      padding: 0;
      width: 100vw;
      height: 100vh;
      background-color: #121212;
      color: #fff;
      display: flex;
      justify-content: center;
      align-items: center;
      font-family: 'Segoe UI', Arial, sans-serif;
      overflow: hidden;
      user-select: none;
    }

    .lock-container {
      text-align: center;
      width: 100%;
      max-width: 500px;
      padding: 2rem;
      border-radius: 16px;
      background-color: rgba(30, 30, 30, 0.6);
      box-shadow: 0 4px 24px rgba(0, 0, 0, 0.5);
    }

    .lock-icon {
      font-size: 80px;
      margin-bottom: 20px;
    }

    .lock-message {
      font-size: 28px;
      font-weight: bold;
      margin-bottom: 30px;
    }

    .hostname {
      font-size: 16px;
      color: #aaa;
      margin-bottom: 30px;
    }

    .form-group {
      margin-bottom: 20px;
    }

    .code-input {
      width: 100%;
      max-width: 300px;
      margin: 0 auto;
      padding: 12px 16px;
      font-size: 20px;
      background-color: rgba(255, 255, 255, 0.1);
      border: 2px solid rgba(255, 255, 255, 0.2);
      border-radius: 8px;
      color: white;
      text-align: center;
      letter-spacing: 2px;
      box-sizing: border-box;
      outline: none;
      transition: border-color 0.3s;
    }

    .code-input:focus {
      border-color: #2196F3;
    }

    .unlock-btn {
      background-color: #2196F3;
      color: white;
      font-size: 18px;
      font-weight: bold;
      padding: 12px 30px;
      border: none;
      border-radius: 8px;
      cursor: pointer;
      margin-top: 10px;
      transition: background-color 0.3s;
    }

    .unlock-btn:hover {
      background-color: #0d8aee;
    }

    .error-message {
      color: #ff5252;
      font-size: 16px;
      margin-top: 20px;
      min-height: 20px;
    }

    .success-message {
      color: #4caf50;
      font-size: 16px;
      margin-top: 20px;
      min-height: 20px;
    }

    /* Loading spinner */
    .spinner {
      display: none;
      margin: 20px auto;
      width: 40px;
      height: 40px;
      border: 4px solid rgba(255, 255, 255, 0.3);
      border-radius: 50%;
      border-top: 4px solid #2196F3;
      animation: spin 1s linear infinite;
    }

    @keyframes spin {
      0% {
        transform: rotate(0deg);
      }

      100% {
        transform: rotate(360deg);
      }
    }

    /* DEBUG UI */
    .debug-panel {
      position: fixed;
      bottom: 0;
      left: 0;
      right: 0;
      background-color: rgba(0, 0, 0, 0.8);
      color: #00ff00;
      font-family: monospace;
      padding: 10px;
      max-height: 200px;
      overflow-y: auto;
      font-size: 14px;
      text-align: left;
      z-index: 9999;
      border-top: 2px solid #00ff00;
    }

    .debug-title {
      font-weight: bold;
      color: #ff9900;
      margin-bottom: 5px;
    }
  </style>
</head>

<body>
  <div class="lock-container">
    <div class="lock-icon">🔒</div>
    <div class="lock-message">This computer is locked</div>
    <div class="hostname" id="hostname"></div>

    <div class="form-group">
      <input type="text" id="codeInput" class="code-input" placeholder="Enter unlock code" maxlength="8"
        autocomplete="off">
    </div>

    <button id="unlockBtn" class="unlock-btn">Unlock</button>

    <div class="spinner" id="loadingSpinner"></div>
    <div class="error-message" id="errorMessage"></div>
    <div class="success-message" id="successMessage"></div>
  </div>

  <!-- Fixed Debug Panel -->
  <div id="debugPanel" class="debug-panel">
    <div class="debug-title">DEBUG INFORMATION</div>
    <div id="debugContent"></div>
  </div>

  <script>
    // Wait for DOM to be ready
    document.addEventListener( 'DOMContentLoaded', async () => {
      // Get elements
      const hostnameEl = document.getElementById( 'hostname' );
      const codeInput = document.getElementById( 'codeInput' );
      const unlockBtn = document.getElementById( 'unlockBtn' );
      const errorMessage = document.getElementById( 'errorMessage' );
      const successMessage = document.getElementById( 'successMessage' );
      const loadingSpinner = document.getElementById( 'loadingSpinner' );
      const debugContent = document.getElementById( 'debugContent' );

      // Debug function
      function debug ( message ) {
        try {
          const timestamp = new Date().toLocaleTimeString();
          const entry = document.createElement( 'div' );
          entry.innerHTML = `[${ timestamp }] ${ message }`;
          debugContent.appendChild( entry );
          console.log( `[DEBUG] ${ message }` );
        } catch ( err ) {
          console.error( "Error in debug function:", err );
        }
      }

      // Direct Supabase validation (backup method)
      async function directSupabaseValidation ( code ) {
        debug( `Using direct Supabase validation for code: ${ code }` );

        try {
          // Using fetch to directly call Supabase API
          const response = await fetch( "https://cecxwuddkezuvjfqriwm.supabase.co/rest/v1/lock_codes?select=*&code=eq." + code + "&machine_id=eq.EC2AMAZ-21ASGA3&used=eq.false", {
            method: "GET",
            headers: {
              "apikey": "eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6ImNlY3h3dWRka2V6dXZqZnFyaXdtIiwicm9sZSI6ImFub24iLCJpYXQiOjE3NDYwMDgxNDgsImV4cCI6MjA2MTU4NDE0OH0._cYVO7QoNn7vZXLuCE1yZPPSwFD1hxHyJINYfBUuZzY",
              "Content-Type": "application/json",
              "Authorization": "Bearer eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6ImNlY3h3dWRka2V6dXZqZnFyaXdtIiwicm9sZSI6ImFub24iLCJpYXQiOjE3NDYwMDgxNDgsImV4cCI6MjA2MTU4NDE0OH0._cYVO7QoNn7vZXLuCE1yZPPSwFD1hxHyJINYfBUuZzY"
            }
          } );

          const data = await response.json();
          debug( `Direct Supabase response: ${ JSON.stringify( data ) }` );

          if ( data && data.length > 0 ) {
            // Found a valid code, now mark it as used
            const codeId = data[ 0 ].id;
            debug( `Valid code found with ID: ${ codeId }` );

            // Try all possible methods to update the record
            await updateCodeAsUsed( codeId, data[ 0 ] );

            return { valid: true, message: "Unlocking..." };
          }

          return { valid: false, message: "Invalid or expired code." };
        } catch ( err ) {
          debug( `Direct Supabase validation error: ${ err.message }` );
          return { valid: false, message: "Error validating code" };
        }
      }

      // Helper function to try multiple methods to update the code
      async function updateCodeAsUsed ( codeId, codeData ) {
        const SUPABASE_URL = "https://cecxwuddkezuvjfqriwm.supabase.co";
        const SUPABASE_KEY = "eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6ImNlY3h3dWRka2V6dXZqZnFyaXdtIiwicm9sZSI6ImFub24iLCJpYXQiOjE3NDYwMDgxNDgsImV4cCI6MjA2MTU4NDE0OH0._cYVO7QoNn7vZXLuCE1yZPPSwFD1hxHyJINYfBUuZzY";

        try {
          // Method 1: Try RPC first (if available)
          debug( `Trying RPC method to update code ${ codeId }...` );
          try {
            const rpcResponse = await fetch( `${ SUPABASE_URL }/rest/v1/rpc/mark_code_as_used`, {
              method: 'POST',
              headers: {
                'Content-Type': 'application/json',
                'apikey': SUPABASE_KEY,
                'Authorization': `Bearer ${ SUPABASE_KEY }`,
                'Prefer': 'return=minimal'
              },
              body: JSON.stringify( {
                code_id: codeId
              } )
            } );

            if ( rpcResponse.ok ) {
              debug( `✅ Success: RPC method updated code as used (${ rpcResponse.status })` );
              return;
            } else {
              debug( `RPC update failed with status ${ rpcResponse.status }` );
            }
          } catch ( rpcErr ) {
            debug( `RPC error: ${ rpcErr.message }` );
          }

          // Method 2: Try direct PATCH to the record
          debug( `Trying direct PATCH update method...` );
          try {
            const patchResponse = await fetch( `${ SUPABASE_URL }/rest/v1/lock_codes?id=eq.${ codeId }`, {
              method: 'PATCH',
              headers: {
                'Content-Type': 'application/json',
                'apikey': SUPABASE_KEY,
                'Authorization': `Bearer ${ SUPABASE_KEY }`,
                'Prefer': 'return=minimal'
              },
              body: JSON.stringify( {
                used: true
              } )
            } );

            if ( patchResponse.ok ) {
              debug( `✅ Success: PATCH method updated code as used (${ patchResponse.status })` );
              return;
            } else {
              debug( `PATCH update failed with status ${ patchResponse.status }` );
            }
          } catch ( patchErr ) {
            debug( `PATCH error: ${ patchErr.message }` );
          }

          // Method 3: Try PUT - full replacement
          debug( `Trying PUT update method...` );
          try {
            const putResponse = await fetch( `${ SUPABASE_URL }/rest/v1/lock_codes?id=eq.${ codeId }`, {
              method: 'PUT',
              headers: {
                'Content-Type': 'application/json',
                'apikey': SUPABASE_KEY,
                'Authorization': `Bearer ${ SUPABASE_KEY }`,
                'Prefer': 'return=minimal'
              },
              body: JSON.stringify( {
                ...codeData,
                used: true
              } )
            } );

            if ( putResponse.ok ) {
              debug( `✅ Success: PUT method updated code as used (${ putResponse.status })` );
              return;
            } else {
              debug( `PUT update failed with status ${ putResponse.status }` );
            }
          } catch ( putErr ) {
            debug( `PUT error: ${ putErr.message }` );
          }

          // Method 4: Last resort - POST with conflict resolution
          debug( `Trying POST with conflict resolution...` );
          try {
            const postResponse = await fetch( `${ SUPABASE_URL }/rest/v1/lock_codes`, {
              method: 'POST',
              headers: {
                'Content-Type': 'application/json',
                'apikey': SUPABASE_KEY,
                'Authorization': `Bearer ${ SUPABASE_KEY }`,
                'Prefer': 'resolution=merge-duplicates'
              },
              body: JSON.stringify( {
                id: codeData.id,
                code: codeData.code,
                machine_id: codeData.machine_id,
                expires_at: codeData.expires_at,
                used: true
              } )
            } );

            if ( postResponse.ok ) {
              debug( `✅ Success: POST method updated code as used (${ postResponse.status })` );
              return;
            } else {
              debug( `POST update failed with status ${ postResponse.status }` );
            }
          } catch ( postErr ) {
            debug( `POST error: ${ postErr.message }` );
          }

          debug( `⚠️ Warning: All update methods failed, but continuing with unlock` );
        } catch ( err ) {
          debug( `❌ Update error: ${ err.message }` );
        }
      }

      // Display initial debug info
      try {
        debug( `<strong>App Started</strong>` );

        // Check if window.api exists
        if ( !window.api ) {
          debug( `❌ ERROR: window.api is undefined. The preload script may not be working properly.` );
          debug( `Will use direct Supabase validation as fallback.` );
          hostnameEl.textContent = `Computer ID: EC2AMAZ-21ASGA3 (Fallback)`;
        } else {
          try {
            const hostname = await window.api.getHostname();
            hostnameEl.textContent = `Computer ID: ${ hostname || 'EC2AMAZ-21ASGA3 (Fallback)' }`;

            // Log initial debug info
            debug( `Hostname: "${ hostname }"` );
            debug( `Expected ID in Supabase: "EC2AMAZ-21ASGA3"` );
            debug( `Match: ${ hostname === "EC2AMAZ-21ASGA3" ? "✅ YES" : "❌ NO - CASE MISMATCH" }` );

            if ( hostname !== "EC2AMAZ-21ASGA3" ) {
              debug( `⚠️ HOSTNAME MISMATCH! Using hardcoded ID for validation` );
            }
          } catch ( err ) {
            debug( `❌ ERROR getting hostname: ${ err.message }` );
            hostnameEl.textContent = `Computer ID: EC2AMAZ-21ASGA3 (Fallback)`;
          }
        }
      } catch ( err ) {
        debug( `❌ STARTUP ERROR: ${ err.message }` );
      }

      // Focus the input field
      codeInput.focus();

      // Handle unlock button click
      unlockBtn.addEventListener( 'click', async () => {
        await validateCode();
      } );

      // Handle enter key press
      codeInput.addEventListener( 'keypress', async ( e ) => {
        if ( e.key === 'Enter' ) {
          await validateCode();
        }
      } );

      // Function to validate the code
      async function validateCode () {
        const code = codeInput.value.trim();

        if ( !code ) {
          showError( 'Please enter an unlock code' );
          return;
        }

        // Show loading state
        setLoading( true );

        try {
          debug( `Attempting to validate code: "${ code }"` );

          let result;

          // Try using the API from preload first
          if ( window.api && window.api.validateCode ) {
            debug( `Using API from preload script` );
            result = await window.api.validateCode( code );
          } else {
            // Fall back to direct validation
            debug( `API not available, using direct Supabase validation` );
            result = await directSupabaseValidation( code );
          }

          debug( `Validation result: ${ JSON.stringify( result ) }` );

          if ( result.valid ) {
            // Code is valid
            showSuccess( result.message );
            debug( `✅ SUCCESS: Code accepted. Unlocking...` );

            // Wait a moment to show the success message before exiting
            setTimeout( () => {
              try {
                if ( window.api && window.api.exitApp ) {
              window.api.exitApp();
                } else {
                  debug( `❌ No exitApp function available, trying window.close()` );
                  window.close();
                }
              } catch ( err ) {
                debug( `❌ ERROR exiting app: ${ err.message }` );
              }
            }, 1500 );
          } else {
            // Code is invalid
            showError( result.message );
            debug( `❌ FAILED: ${ result.message }` );
            codeInput.value = '';
            codeInput.focus();
          }
        } catch ( error ) {
          debug( `⚠️ ERROR: ${ error.message || 'Unknown error' }` );
          showError( 'An error occurred. Please try again.' );
          codeInput.focus();
        } finally {
          setLoading( false );
        }
      }

      // Show error message
      function showError ( message ) {
        errorMessage.textContent = message;
        successMessage.textContent = '';
      }

      // Show success message
      function showSuccess ( message ) {
        successMessage.textContent = message;
        errorMessage.textContent = '';
      }

      // Set loading state
      function setLoading ( isLoading ) {
        unlockBtn.disabled = isLoading;
        codeInput.disabled = isLoading;
        loadingSpinner.style.display = isLoading ? 'block' : 'none';
      }
    } );

    // Prevent right-click context menu
    document.addEventListener( 'contextmenu', ( e ) => {
      e.preventDefault();
      return false;
    } );

    // Block some keyboard shortcuts but allow typing in the input field
    document.addEventListener( 'keydown', ( e ) => {
      // Allow normal typing and navigation in the input field
      if ( e.target.tagName === 'INPUT' ) {
        // Only prevent certain key combinations
        if (
          ( e.ctrlKey && [ 'w', 'r', 'q' ].includes( e.key.toLowerCase() ) ) ||
          ( e.altKey && e.key === 'F4' ) ||
          e.key === 'F11' ||
          e.key === 'Escape'
        ) {
          e.preventDefault();
          return false;
        }
        return true;
      }

      // Block all keys outside of the input field
      e.preventDefault();
      return false;
    } );

    // Prevent selecting text except in input
    document.addEventListener( 'selectstart', ( e ) => {
      if ( e.target.tagName !== 'INPUT' ) {
        e.preventDefault();
        return false;
      }
    } );

    // Prevent dragging
    document.addEventListener( 'dragstart', ( e ) => {
      e.preventDefault();
      return false;
    } );
  </script>
</body>

</html>
